server {
        listen 80;
        server_name admin.laidianle.cc;
        #rewrite ^(.*) https://$server_name$1 permanent;
        return 301 https://$server_name$request_uri;
}

server {
        listen 443 ssl ;
        server_name  admin.laidianle.cc;
        # ssl on;
        ssl_certificate /etc/nginx/ssl/admin.laidianle.cc.pem;
        ssl_certificate_key /etc/nginx/ssl/admin.laidianle.cc.key;
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers on;

        index index.php index.html index.htm default.php default.htm default.html;
        root /usr/share/nginx/qiayun-admin/dist;

        location / {
                expires -1s;
                add_header Cache-Control no-cache;
                try_files $uri $uri/ /index.html;
        }

        location /api/ {
                client_max_body_size 128M;
                proxy_set_header Host $host:$server_port;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Real-PORT $remote_port;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://127.0.0.1:3010;
        }

        #禁止访问的文件或目录
        location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md)
        {
                return 404;
        }
        
        #一键申请SSL证书验证目录相关设置
        location ~ \.well-known{
                allow all;
        }
        
        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
        {
                expires      30d;
                error_log /dev/null;
                access_log /dev/null;
        }
        
        location ~ .*\.(js|css)?$
        {
                expires      12h;
                error_log /dev/null;
                access_log /dev/null; 
        }
        access_log  /var/log/nginx/admin.laidianle.cc.log;
        error_log  /var/log/nginx/admin.laidianle.cc.error.log;
}
