# 这个配置文件用于直接访问后端 API（跨域访问）
# 如果前端通过同域 nginx 代理访问，则不需要启用此配置

server {
    listen 3010;          # Nginx 监听端口
    server_name _;        # 通配符匹配所有请求

    # 直接返回后端服务的响应，并添加 CORS 头
    location / {
        # 如果后端应用直接监听 3010，不需要代理
        # 如果需要添加 CORS，可以使用 add_header
        
        # 方式1：如果后端应用监听其他端口（如3000），取消下面的注释
        # proxy_pass http://127.0.0.1:3000;
        
        # 方式2：如果后端直接监听 3010，则此配置文件可以删除或禁用
        # 因为后端已经在 3010 端口运行，nginx 监听同一端口会冲突
        
        # CORS 跨域头
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # 处理 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 注意：如果后端应用本身就运行在 3010 端口
        # 则不能使用此 nginx 配置，会端口冲突
        # 建议：
        # 1. 让后端运行在其他端口（如3000），nginx 在 3010 监听并代理
        # 2. 或者删除此配置文件，让后端直接在 3010 运行并自行处理 CORS
        return 502 "后端应直接监听 3010 端口，无需此 nginx 配置";
    }

    # 日志
    access_log /var/log/nginx/qiayun-admin-api-ip-access.log;
    error_log  /var/log/nginx/qiayun-admin-api-ip-error.log;
}
