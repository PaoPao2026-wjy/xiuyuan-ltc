:root{
  --blue:#0A7CB3; --blue-d:#05608A; --blue-l:#EAF4FA; --blue-m:#CBE4F2;
  --green:#23644C; --green-d:#194E3B; --green-l:#EAF3EF;
  --ink:#0C1C24; --ink2:#3A4E59; --gray:#6E818C; --gray2:#9AABB5;
  --line:#E9EFF3; --line2:#F1F5F8; --line3:#DCE5EB;
  --bg:#F6F9FA; --card:#FFFFFF;
  --red:#BE3B2E; --red-l:#FDEDEB;
  --amber:#A26200; --amber-l:#FCF3E2;
  --ok:#1A7549; --ok-l:#E8F4ED;
  --r:10px; --r-sm:7px; --r-xs:5px;
  --sh1:0 1px 2px rgba(12,28,36,.045), 0 1px 3px rgba(12,28,36,.03);
  --sh2:0 4px 14px -5px rgba(12,28,36,.10), 0 2px 6px -2px rgba(12,28,36,.05);
  --sh3:0 28px 80px -24px rgba(12,28,36,.30);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Source Han Sans SC","Source Han Sans SC Normal","PingFang SC",
              "Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  letter-spacing:.1px;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ================= 布局 ================= */
#app{display:flex;height:100vh;overflow:hidden}
aside{
  width:234px;flex:0 0 234px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.brand{padding:18px 18px 16px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line2)}
.brand .mk{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background-color:#FFFFFF;background-image:var(--lg);background-position:center;background-size:82%;background-repeat:no-repeat;
  border:1px solid var(--line2);box-sizing:border-box;
  box-shadow:0 2px 8px -1px rgba(10,124,179,.38), inset 0 1px 0 rgba(255,255,255,.24);
}
.brand .tx b{display:block;font-size:13.8px;font-weight:700;letter-spacing:.05px;line-height:1.25}
.brand .tx span{display:block;font-size:8.2px;color:var(--gray2);letter-spacing:.15px;margin-top:3.5px;font-weight:400;white-space:nowrap}

nav{flex:1;overflow-y:auto;padding:8px 0 14px}
nav::-webkit-scrollbar{width:4px}
nav::-webkit-scrollbar-thumb{background:var(--line3);border-radius:2px}
.grp{padding:15px 19px 6px;font-size:9.5px;color:var(--gray2);letter-spacing:1.5px;font-weight:400}
.ni{
  display:flex;align-items:center;gap:10px;padding:8px 10px;margin:1px 9px;
  cursor:pointer;color:var(--ink2);border-radius:var(--r-sm);font-size:13px;
  user-select:none;transition:background .14s var(--ease),color .14s var(--ease);
}
.ni:hover{background:#F2F6F9;color:var(--ink)}
.ni.on{background:var(--blue-l);color:var(--blue-d);font-weight:700;box-shadow:inset 0 0 0 1px rgba(10,124,179,.13)}
.ni .ic{
  width:17px;height:17px;flex:0 0 17px;display:flex;align-items:center;justify-content:center;
  opacity:.55;transition:opacity .14s;
}
.ni .ic svg{width:17px;height:17px;display:block}
.ni.on .ic,.ni:hover .ic{opacity:1}
.ni .bdg{
  margin-left:auto;background:var(--red);color:#fff;font-size:9.5px;
  min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;
  padding:0 4px;font-weight:700;
}
.sidefoot{
  padding:11px 18px 13px;border-top:1px solid var(--line2);font-size:10px;
  color:var(--gray2);line-height:1.7;letter-spacing:.2px;
}

main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
header.top{
  height:60px;flex:0 0 60px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 24px;position:relative;
}
header.top::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#0A7CB3 0%,#18809F 42%,#23644C 100%);
}
header.top h1{font-size:16.5px;font-weight:700;letter-spacing:-.1px;white-space:nowrap}
header.top .sp{flex:1}
.searchbox{position:relative}
.searchbox input{
  width:236px;height:33px;border:1px solid transparent;border-radius:var(--r-sm);
  padding:0 12px 0 32px;background:#F4F8FA;outline:none;font-size:12.5px;
  transition:all .16s var(--ease);
}
.searchbox input::placeholder{color:var(--gray2)}
.searchbox input:focus{border-color:var(--blue-m);background:#fff;box-shadow:0 0 0 3.5px rgba(10,124,179,.09)}
.searchbox .si{position:absolute;left:11px;top:8px;color:var(--gray2);font-size:12px;pointer-events:none}
.thb{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s var(--ease);flex:0 0 32px;
}
.thb:hover{border-color:var(--blue-m);color:var(--blue-d);background:#FBFDFC}
.thb svg{width:15px;height:15px}
.who{
  display:flex;align-items:center;gap:9px;padding:4px 12px 4px 5px;border:1px solid var(--line);
  border-radius:24px;cursor:pointer;background:#fff;transition:all .15s var(--ease);
}
.who:hover{border-color:var(--blue-m);box-shadow:var(--sh1)}
.who .av{
  width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background-color:#fff;background-image:var(--lg);background-position:center;background-size:86%;background-repeat:no-repeat;
  border:1px solid var(--line2);
  box-shadow:0 1px 2px rgba(12,28,36,.07);
}
.who .nm{font-size:12.3px;font-weight:700;line-height:1.25}
.who .rl{font-size:9px;color:var(--gray2);line-height:1.25;margin-top:1px}
.who .ar{font-size:8.5px;color:var(--gray2);margin-left:3px}

#view{flex:1;overflow-y:auto;padding:22px 26px 48px}
#view::-webkit-scrollbar{width:10px}
#view::-webkit-scrollbar-thumb{background:#DDE7ED;border-radius:5px;border:3px solid var(--bg)}
#view::-webkit-scrollbar-thumb:hover{background:#C7D6DE}

/* ================= 通用 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:13.5px;font-weight:700;letter-spacing:.1px}
.sec-h .line{flex:1;height:1px;background:var(--line2)}
.sec-h .more{font-size:11.5px;color:var(--blue);cursor:pointer;transition:.14s}
.sec-h .more:hover{color:var(--blue-d)}

.btn{
  height:32px;padding:0 14px;border:1px solid var(--line3);background:#fff;border-radius:var(--r-sm);
  cursor:pointer;font-size:12.3px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;
  transition:all .14s var(--ease);white-space:nowrap;
}
.btn:hover{border-color:#C9D8E1;color:var(--ink);background:#FCFEFD;box-shadow:var(--sh1)}
.btn:active{transform:translateY(.5px)}
.btn.pri{
  background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;
  box-shadow:0 1px 2px rgba(10,124,179,.28),inset 0 1px 0 rgba(255,255,255,.14);
}
.btn.pri:hover{background:#05608A;border-color:#05608A;color:#fff}
.btn.gr{
  background:var(--green);border-color:var(--green);color:#fff;font-weight:700;
  box-shadow:0 1px 2px rgba(35,100,76,.26),inset 0 1px 0 rgba(255,255,255,.13);
}
.btn.gr:hover{background:var(--green-d);border-color:var(--green-d);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:11.5px;border-radius:var(--r-xs)}
.btn.gh{background:transparent;border-color:transparent;color:var(--gray)}
.btn.gh:hover{background:#F2F6F9;border-color:transparent;color:var(--ink2);box-shadow:none}
.btn.dg:hover{border-color:#E6B4AD;color:var(--red);background:var(--red-l)}

.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.hint{font-size:11.5px;color:var(--gray)}

/* 表格 */
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1)}
table{width:100%;border-collapse:collapse;font-size:12.6px}
thead th{
  background:#FCFEFD;text-align:left;padding:11px 16px;font-weight:700;color:#8FA1AC;
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:10.5px;letter-spacing:.9px;
}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .12s var(--ease)}
tbody tr:hover{background:#F8FBFD}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:400}
td.mono{font-variant-numeric:tabular-nums;color:var(--gray);font-size:11.6px;white-space:nowrap;letter-spacing:.15px}
td.strong{font-weight:700;color:var(--ink)}
.empty{padding:58px 20px;text-align:center;color:var(--gray2);font-size:12.5px;line-height:1.85}
.empty .big{font-size:28px;display:block;margin-bottom:10px;opacity:.26}

.tag{
  display:inline-block;padding:2px 8px;border-radius:var(--r-xs);font-size:10.8px;font-weight:700;
  white-space:nowrap;line-height:1.6;letter-spacing:.2px;
}
.t-a{background:#E6F3EC;color:#146845}
.t-b{background:#FBF1DE;color:#8A5300}
.t-c{background:#F0F3F5;color:#6E818C}
.t-blue{background:var(--blue-l);color:var(--blue-d)}
.t-red{background:var(--red-l);color:#A5322A}
.t-gray{background:#F0F3F5;color:#6E818C}
.t-green{background:var(--green-l);color:var(--green)}

/* KPI —— 大字细体，高级感核心 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:12px;margin-bottom:22px}
.kpi{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 19px 17px;
  box-shadow:var(--sh1);position:relative;overflow:hidden;
  transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s;
}
.kpi:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--line3)}
.kpi .lb{font-size:11px;color:var(--gray);letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.kpi .vl{
  font-size:clamp(24px,1.85vw,33px);font-weight:300;margin-top:11px;letter-spacing:-1.4px;
  font-variant-numeric:tabular-nums;line-height:1.02;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kpi .sub{font-size:10.6px;color:var(--gray2);margin-top:9px;letter-spacing:.2px}
.kpi.b .vl{color:var(--blue-d)}
.kpi.g .vl{color:var(--green)}
.kpi.r .vl{color:var(--red)}
.kpi.a .vl{color:var(--amber)}
.kpi::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;
  background:linear-gradient(180deg,var(--blue),rgba(10,124,179,0));
  opacity:.85;
}
.kpi.g::after{background:linear-gradient(180deg,var(--green),rgba(35,100,76,0))}
.kpi.r::after{background:linear-gradient(180deg,var(--red),rgba(190,59,46,0))}
.kpi.a::after{background:linear-gradient(180deg,var(--amber),rgba(162,98,0,0))}
.kpi.b::after{background:linear-gradient(180deg,var(--blue),rgba(10,124,179,0))}

/* 抽屉 */
#mask{position:fixed;inset:0;background:rgba(9,24,31,.30);opacity:0;pointer-events:none;transition:.2s var(--ease);z-index:40;backdrop-filter:blur(1.5px)}
#mask.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;right:0;bottom:0;width:680px;max-width:95vw;background:#fff;
  box-shadow:-14px 0 50px -10px rgba(9,24,31,.22);transform:translateX(100%);
  transition:.26s var(--ease);z-index:50;display:flex;flex-direction:column;
}
#drawer.on{transform:translateX(0)}
.dh{padding:19px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .t1{font-size:15.5px;font-weight:700;line-height:1.35;letter-spacing:-.1px}
.dh .t2{font-size:11.5px;color:var(--gray);margin-top:5px}
.dh .x{
  margin-left:auto;cursor:pointer;color:var(--gray2);font-size:20px;line-height:1;
  padding:2px 7px;border-radius:var(--r-xs);transition:.14s;
}
.dh .x:hover{background:#F2F6F9;color:var(--ink)}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);background:#FCFEFD}
.tab{
  padding:10px 14px;font-size:12.2px;cursor:pointer;color:var(--gray);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;transition:.15s;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue-d);border-bottom-color:var(--blue);font-weight:700}
.tab .c{font-size:9.5px;background:#EAF0F3;color:var(--ink2);padding:1px 5px;border-radius:5px;margin-left:5px;font-weight:700}
.tab.on .c{background:var(--blue-l);color:var(--blue-d)}
.db{flex:1;overflow-y:auto;padding:20px 24px 36px}
.db::-webkit-scrollbar{width:9px}
.db::-webkit-scrollbar-thumb{background:#DDE7ED;border-radius:5px;border:3px solid #fff}

/* 定义列表 */
.dl{display:grid;grid-template-columns:108px 1fr 108px 1fr;gap:13px 18px;font-size:12.6px}
.dl .k{color:var(--gray);font-size:11.5px;padding-top:1px}
.dl .v{color:var(--ink);word-break:break-word}
.dl .v.span2{grid-column:span 3}
.dl .full{grid-column:1/-1}
.dl .k.full{grid-column:1/-1}

/* 弹窗 */
#modal{
  position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
  z-index:60;padding:48px 16px;overflow-y:auto;background:rgba(9,24,31,.28);backdrop-filter:blur(2px);
}
#modal.on{display:flex}
.mbox{
  background:#fff;border-radius:12px;width:720px;max-width:100%;
  box-shadow:var(--sh3);overflow:hidden;animation:pop .18s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.mh{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mh b{font-size:14px;font-weight:700;letter-spacing:-.05px}
.mh .x{margin-left:auto;cursor:pointer;color:var(--gray2);font-size:20px;padding:0 6px;border-radius:var(--r-xs);transition:.14s}
.mh .x:hover{background:#F2F6F9;color:var(--ink)}
.mb{padding:20px 22px;max-height:calc(100vh - 220px);overflow-y:auto}
.mb::-webkit-scrollbar{width:9px}
.mb::-webkit-scrollbar-thumb{background:#DDE7ED;border-radius:5px}
.mf{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#FCFEFD}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:14px}
.fg.one{grid-template-columns:1fr}
.fi{display:flex;flex-direction:column;gap:6px;min-width:0}
.fi label{font-size:11.5px;color:var(--ink2);font-weight:700;letter-spacing:.1px}
.fi label .rq{color:var(--red);margin-left:2px}
.fi input,.fi select,.fi textarea{
  border:1px solid var(--line3);border-radius:var(--r-sm);padding:8px 11px;background:#FCFEFD;
  outline:none;transition:all .14s var(--ease);font-size:12.6px;width:100%;color:var(--ink);
}
.fi input:hover,.fi select:hover,.fi textarea:hover{border-color:#D0DCE4}
.fi input:focus,.fi select:focus,.fi textarea:focus{
  border-color:var(--blue-m);background:#fff;box-shadow:0 0 0 3.5px rgba(10,124,179,.09);
}
.fi textarea{resize:vertical;min-height:64px;line-height:1.62}
.fi .hint{font-size:10.6px;color:var(--gray2)}

/* 看板 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1180px){.grid2,.grid3{grid-template-columns:1fr}}

.bars{display:flex;flex-direction:column;gap:11px;padding:18px 20px}
.bar{display:grid;grid-template-columns:76px 1fr 54px;gap:12px;align-items:center;font-size:11.8px}
.bar .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:#F1F6F9;border-radius:3px;overflow:hidden}
.bar .fi2{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#0A7CB3,#55ADD6);
  transition:width .5s var(--ease);
}
.bar .fi2.g{background:linear-gradient(90deg,#23644C,#55947C)}
.bar .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}

/* 阶段条 */
.stages{display:flex;gap:6px;padding:18px 20px 14px;overflow-x:auto}
.stg{flex:1;min-width:66px;text-align:center}
.stg .bar2{height:5px;border-radius:3px;background:#ECF2F6;margin-bottom:9px;transition:.3s}
.stg.on .bar2{background:linear-gradient(90deg,#0A7CB3,#45A5D2)}
.stg .nm{font-size:10.5px;color:var(--gray);white-space:nowrap;letter-spacing:.15px}
.stg.on .nm{color:var(--ink2);font-weight:700}
.stg .vv{font-size:16px;font-weight:300;color:var(--ink);margin-bottom:5px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stg:not(.on) .vv{color:var(--gray2)}

/* 流程链 */
.flow{display:flex;align-items:center;gap:0;padding:16px 20px;overflow-x:auto}
.fl{display:flex;align-items:center}
.fl .n2{
  padding:8px 13px;border-radius:var(--r-sm);background:#F7FAFC;border:1px solid var(--line);
  font-size:11.8px;color:var(--ink2);white-space:nowrap;font-weight:700;
}
.fl .n2.on{background:var(--green-l);border-color:#C2DCD0;color:var(--green)}
.fl .n2.cur{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 8px -2px rgba(35,100,76,.40)}
.fl .ar{color:#CBD9E1;margin:0 8px;font-size:10.5px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(16px) scale(.98);
  background:#0F2630;color:#fff;padding:11px 22px;border-radius:9px;font-size:12.6px;
  opacity:0;pointer-events:none;transition:.24s var(--ease);z-index:99;
  box-shadow:0 16px 44px -10px rgba(9,24,31,.48),inset 0 1px 0 rgba(255,255,255,.1);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#toast.err{background:#A5322A}

.notice{
  background:var(--blue-l);border:1px solid #D2E6F2;border-radius:9px;padding:13px 16px;
  font-size:12.2px;color:var(--blue-d);line-height:1.75;margin-bottom:18px;
}
.notice b{font-weight:700}
.notice.warn{background:var(--amber-l);border-color:#EFDFC1;color:#7A4A00}
.notice.ok{background:var(--ok-l);border-color:#CBE4D6;color:#13603F}

/* ============ 主题 B：深墨侧边栏（只深导航栏，内容区仍全白） ============ */
body.t-b aside{background:#0F2530;border-right:none;box-shadow:1px 0 0 rgba(255,255,255,.04)}
body.t-b .brand{border-bottom:1px solid rgba(255,255,255,.065)}
body.t-b .brand .tx b{color:#fff}
body.t-b .brand .tx span{color:rgba(255,255,255,.40)}
body.t-b .brand .mk{box-shadow:0 3px 14px -2px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.26)}
body.t-b .grp{color:rgba(255,255,255,.32)}
body.t-b .ni{color:rgba(255,255,255,.70)}
body.t-b .ni:hover{background:rgba(255,255,255,.065);color:#fff}
body.t-b .ni.on{
  background:rgba(10,124,179,.26);color:#fff;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(96,186,230,.30);
}
body.t-b .ni.on .ic,body.t-b .ni:hover .ic{opacity:1}
body.t-b .sidefoot{color:rgba(255,255,255,.30);border-top-color:rgba(255,255,255,.065)}
body.t-b nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}
body.t-b .ni .bdg{background:#C4382B;box-shadow:0 0 0 2px rgba(15,37,48,.9)}

/* ================= v3 控件精修 ================= */
:root{ --rb:8px; --rb-s:6px; }

/* ---------- 按钮底座：微渐变 + 内高光 + 双层影 ---------- */
.btn{
  height:34px;padding:0 15px;border-radius:var(--rb);
  font-size:12.5px;letter-spacing:.2px;font-weight:400;
  background:linear-gradient(180deg,#FFFFFF 0%,#F7FAFC 100%);
  border:1px solid #DCE5EB;color:var(--ink2);
  box-shadow:0 1px 2px rgba(12,28,36,.055),inset 0 1px 0 #FFFFFF;
  transition:background .15s var(--ease),border-color .15s var(--ease),
             color .15s var(--ease),box-shadow .16s var(--ease),
             transform .1s var(--ease);
}
.btn:hover{
  background:linear-gradient(180deg,#FFFFFF 0%,#F0F6FA 100%);
  border-color:#BCD2E0;color:var(--ink);
  box-shadow:0 2px 6px rgba(12,28,36,.085),inset 0 1px 0 #FFFFFF;
}
.btn:active{
  transform:translateY(1px);background:#EBF2F7;
  box-shadow:inset 0 1px 3px rgba(12,28,36,.13);
}
.btn:focus-visible{outline:2px solid var(--blue-m);outline-offset:2px}

/* ---------- 主按钮：蓝渐变 + 顶部高光 + 底部内暗 ---------- */
.btn.pri{
  background:linear-gradient(180deg,#1090CB 0%,#0A7CB3 56%,#0871A2 100%);
  border-color:#0A6E9E;color:#fff;font-weight:700;
  box-shadow:0 1px 2px rgba(6,60,90,.18),
             0 3px 8px -2px rgba(10,124,179,.32),
             inset 0 1px 0 rgba(255,255,255,.26),
             inset 0 -1px 0 rgba(0,0,0,.10);
}
.btn.pri:hover{
  background:linear-gradient(180deg,#1399D6 0%,#0C86BF 56%,#0980B4 100%);
  border-color:#0B7AAE;color:#fff;transform:translateY(-1px);
  box-shadow:0 2px 4px rgba(6,60,90,.18),
             0 8px 18px -4px rgba(10,124,179,.40),
             inset 0 1px 0 rgba(255,255,255,.30),
             inset 0 -1px 0 rgba(0,0,0,.10);
}
.btn.pri:active{
  transform:translateY(0);
  background:linear-gradient(180deg,#0A74A6 0%,#086A99 100%);
  box-shadow:0 1px 2px rgba(6,60,90,.20),inset 0 2px 5px rgba(0,0,0,.22);
}

/* ---------- 绿按钮 ---------- */
.btn.gr{
  background:linear-gradient(180deg,#2B7B5E 0%,#23644C 56%,#1E5741 100%);
  border-color:#1E5942;color:#fff;font-weight:700;
  box-shadow:0 1px 2px rgba(20,60,45,.20),
             0 3px 8px -2px rgba(35,100,76,.30),
             inset 0 1px 0 rgba(255,255,255,.22),
             inset 0 -1px 0 rgba(0,0,0,.10);
}
.btn.gr:hover{
  background:linear-gradient(180deg,#338867 0%,#287054 56%,#23644C 100%);
  border-color:#23644C;color:#fff;transform:translateY(-1px);
  box-shadow:0 2px 4px rgba(20,60,45,.20),
             0 8px 18px -4px rgba(35,100,76,.36),
             inset 0 1px 0 rgba(255,255,255,.26),
             inset 0 -1px 0 rgba(0,0,0,.10);
}
.btn.gr:active{
  transform:translateY(0);
  background:linear-gradient(180deg,#216049 0%,#1B5340 100%);
  box-shadow:0 1px 2px rgba(20,60,45,.22),inset 0 2px 5px rgba(0,0,0,.20);
}

/* ---------- 尺寸与变体 ---------- */
.btn.sm{height:28px;padding:0 11px;font-size:11.8px;border-radius:var(--rb-s);gap:5px}
.btn.gh{background:transparent;border-color:transparent;box-shadow:none;color:var(--gray)}
.btn.gh:hover{background:#EDF3F8;border-color:transparent;box-shadow:none;color:var(--ink2);transform:none}
.btn.gh:active{background:#E4EDF4;box-shadow:none;transform:none}
.btn.dg{color:var(--gray)}

/* ============ 基础 ============ */
const S = { view:'dash', user:'张伟', role:'总经理 / 市场负责人', q:'', meta:null, data:{}, sort:{}, drawer:null };

const IC = {
  rates:'<path d="M3.5 8.5h14M14.5 4.5l4 4-4 4"/><path d="M20.5 15.5h-14M9.5 11.5l-4 4 4 4"/>',

  payments:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7.4v9.2M9.5 10.1h5M9.5 13.7h5"/>',

  'db-trade':'<circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.6 2.7 2.6 14.5 0 17.2M12 3.4c-2.6 2.7-2.6 14.5 0 17.2"/>',

  'db-made':'<path d="M2.8 20.4V9.2l5.6 3.5V9.2l5.6 3.5V9.2l5.6 3.5v7.7z"/><path d="M2.4 20.4h19.2"/>',

  'db-mat':'<rect x="3" y="13.2" width="7.4" height="7.2" rx="1.4"/><rect x="13.6" y="13.2" width="7.4" height="7.2" rx="1.4"/><rect x="8.3" y="3.6" width="7.4" height="7.2" rx="1.4"/>',
  logs:'<path d="M8.4 6h12.2M8.4 12h12.2M8.4 18h12.2"/><circle cx="4" cy="6" r="1.1"/><circle cx="4" cy="12" r="1.1"/><circle cx="4" cy="18" r="1.1"/>',

};
function svgIcon(k){
  const d = IC[k];
  if(!d) return '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
}
function applyTheme(t){
  document.body.className = (t === 'b') ? 't-b' : 't-a';
  try{ localStorage.setItem('ltc_theme', t); }catch(e){}
}
function toggleTheme(){
  const cur = document.body.classList.contains('t-b') ? 'b' : 'a';
  applyTheme(cur === 'b' ? 'a' : 'b');
}

const NAV = [
  { g:'总览', items:[
    {k:'dash', t:'工作台', ic:'dash'},
    {k:'leads', t:'线索池', ic:'leads'},
    {k:'opps', t:'机会池', ic:'opps'},
    {k:'reviews', t:'评审中心', ic:'reviews', badge:'reviews'},
  ]},
  { g:'项目全流程', items:[
    {k:'projects', t:'项目中心', ic:'projects'},
    {k:'flow', t:'全流程看板', ic:'flow'},
  ]},
  { g:'业务执行', items:[
    {k:'quotes', t:'报价单', ic:'quotes'},
    {k:'contracts', t:'合同', ic:'contracts'},
    {k:'production', t:'生产订单', ic:'production'},
    {k:'purchases', t:'采购单', ic:'purchases'},
    {k:'outbounds', t:'出库单', ic:'outbounds'},
    {k:'shipments', t:'发货单', ic:'shipments'},
    {k:'payments', t:'回款单', ic:'payments'},
  ]},
  { g:'数据看板', items:[
    {k:'db-boss', t:'老板看板', ic:'db-boss'},
    {k:'db-trade', t:'外贸看板', ic:'db-trade'},
    {k:'db-media', t:'新媒体看板', ic:'db-media'},
    {k:'db-made', t:'中国制造网', ic:'db-made'},
    {k:'db-fin', t:'财务看板', ic:'db-fin'},
    {k:'db-prod', t:'生产订单看板', ic:'db-prod'},
    {k:'db-mat', t:'物料&发货看板', ic:'db-mat'},
  ]},
  { g:'系统', items:[
    {k:'rates', t:'汇率', ic:'rates'},
    {k:'logs', t:'操作日志', ic:'logs'},
    {k:'settings', t:'系统设置', ic:'settings'},
  ]},
];

const TITLE = {};
NAV.forEach(g=>g.items.forEach(i=>TITLE[i.k]=i.t));

/* ============ 工具 ============ */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n, cur){
  const c = cur || 'USD';
  const sym = {USD:'$',CNY:'¥',EUR:'€',UZS:'',KZT:''}[c] || '';
  const v = Number(n||0);
  if(c==='UZS'||c==='KZT') return sym + v.toLocaleString('en-US',{maximumFractionDigits:0}) + (sym?'':' '+c);
  return sym + v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function usdTxt(n){
  const v = Number(n||0);
  return '$' + v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on' + (err?' err':'');
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className=''; }, 2400);
}
function stageCls(s){
  const m = {'立项':'t-gray','报价':'t-blue','合同':'t-green','生产':'t-b','采购':'t-b','仓储':'t-b','发货':'t-blue','回款':'t-green','完成':'t-a'};
  return m[s] || 't-gray';
}
function gradeCls(g){
  if(!g) return 't-gray';
  if(g.startsWith('A')) return 't-a';
  if(g.startsWith('B')) return 't-b';
  return 't-c';
}
function statusCls(s){
  const ok=['客户接受','已完成','已入库','已出库','已签收','已结清','转机会点','通过'];
  const bad=['客户拒绝','已过期','已终止','无效关闭','待确认'];
  const mid=['执行中','已发出','生产中','已下单','在途','已装箱','已报关','已到港','部分回款','持续跟进','待排产'];
  if(ok.includes(s)) return 't-a';
  if(bad.includes(s)) return 't-red';
  if(mid.includes(s)) return 't-blue';
  return 't-gray';
}
function daysFrom(d){
  if(!d) return null;
  const a = new Date(d+'T00:00:00'), b = new Date(todayStr()+'T00:00:00');
  return Math.round((a-b)/86400000);
}

/* ============ API ============ */
async function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({'X-User': encodeURIComponent(S.user)}, opt.headers||{});
  if(opt.body && typeof opt.body !== 'string'){
    opt.headers['Content-Type']='application/json';
    opt.body = JSON.stringify(opt.body);
  }
  const r = await fetch(path, opt);
  const txt = await r.text();
  let j = null;
  try{ j = JSON.parse(txt); }catch(e){ j = {error:txt.slice(0,200)}; }
  if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

/* ============ 导航 ============ */
function myPerms(){
  const r = ((S.meta && S.meta.roles) || []).find(x => x.uname === S.user);
  return (r && r.perms) || null;
}
function can(k){
  const p = myPerms();
  if(!p) return true;
  return p.indexOf('*') >= 0 || p.indexOf(k) >= 0;
}
function renderNav(){
  const nb = (S.data.summary && S.data.summary.pending_reviews) ? S.data.summary.pending_reviews.length : 0;
  document.getElementById('nav').innerHTML = NAV.map(g=>{
    const its = g.items.filter(i=>can(i.k));
    if(!its.length) return '';
    return '<div class="grp">'+esc(g.g)+'</div>' + its.map(i=>{
      let b = '';
      if(i.badge==='reviews' && nb>0) b = '<span class="bdg">'+nb+'</span>';
      return '<div class="ni '+(S.view===i.k?'on':'')+'" onclick="go(\''+i.k+'\')">'+
        '<span class="ic">'+svgIcon(i.ic)+'</span><span>'+esc(i.t)+'</span>'+b+'</div>';
    }).join('');
  }).join('');
}
function setWho(){
  document.getElementById('avU').textContent = '';
  document.getElementById('nmU').textContent = S.user;
  const _r = ((S.meta && S.meta.roles) || []).find(x => x.uname === S.user);
  document.getElementById('rlU').textContent = S.role.split(' / ')[0] + (_r && _r.en ? ' · ' + _r.en : '');
}
async function switchRole(){
  const roles = S.meta ? S.meta.roles : [];
  openModal('切换角色（模拟不同部门登录）', '<div class="notice">切换后，左侧菜单和可操作范围会按角色权限收敛。这是模拟登录，用来验证权限矩阵和评审流转。</div>'+
    '<div style="display:grid;gap:8px">'+ roles.map((r,i)=>{
      const on = r.uname===S.user;
      return '<div class="card" style="padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;'+(on?'border-color:var(--blue);background:var(--blue-l)':'')+'" onclick="pickRole('+i+')">'+
        '<div style="width:30px;height:30px;border-radius:50%;background:'+(on?'var(--blue)':'var(--green)')+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">'+esc(r.uname.slice(0,1))+'</div>'+
        '<div style="flex:1"><div style="font-weight:600;font-size:12.5px">'+esc(r.uname)+(r.en?' <span style="color:var(--gray2);font-weight:400;font-size:11px">'+esc(r.en)+'</span>':'')+'</div><div style="font-size:10.5px;color:var(--gray)">'+esc(r.dept)+' · '+esc(r.role)+'</div></div>'+
        (on?'<span class="tag t-blue">当前</span>':'<span class="hint">切换</span>')+
      '</div>';
    }).join('')+'</div>', null, {hideFooter:true, width:560});
}
function pickRole(i){
  const r = S.meta.roles[i];
  S.user = r.uname; S.role = r.role;
  setWho(); closeModal();
  toast('已切换为 '+r.uname+' · '+(r.dept||''));
  renderNav();
  go(can(S.view) ? S.view : 'dash');
}

/* ============ 路由 ============ */
async function go(k){
  if(!can(k)){ toast('当前角色无权访问该模块'); return; }
  S.view = k; S.q='';
  document.getElementById('q').value='';
  document.getElementById('pTitle').textContent = TITLE[k] || k;
  renderNav();
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">加载中…</div>';
  try{
    await renderView(k);
  }catch(e){
    v.innerHTML = '<div class="notice warn">加载失败：'+esc(e.message)+'</div>';
  }
}
document.getElementById('q').addEventListener('input', e=>{
  S.q = e.target.value.trim();
  renderView(S.view, true);
});

    {k:'email',t:'邮箱',type:'email'},
    {k:'addr',t:'地址',full:1},
    {k:'note',t:'备注',type:'textarea',full:1},
  ], cols:[
    {k:'code',t:'编码',w:'96px',cls:'mono'},
    {k:'name',t:'供应商',cls:'strong'},
    {k:'category',t:'类别'},
    {k:'contact',t:'联系人'},
    {k:'phone',t:'电话',cls:'mono'},
    {k:'email',t:'邮箱'},
  ]},
};

function custName(id){
  const cs = S.data['customers'] || [];
  const c = cs.find(x=>String(x.id)===String(id));
  return c ? esc(c.name_en) : '<span class="hint">—</span>';
}
function refText(tbl, id){
  const list = S.data[tbl] || [];
  const r = list.find(x=>String(x.id)===String(id));
  if(!r) return '';
  return r.name_en || r.title || r.proj_no || r.lead_no || r.opp_no || r.name || ('#'+id);
}
</script>

<script>
/* ============ 主渲染 ============ */
async function renderView(k, keepQ){
  const v = document.getElementById('view');
  // 预加载公共引用表
  const need = ['customers','leads','projects'];
  for(const t of need){
    if(!S.data[t]) S.data[t] = await api('/api/'+t);
  }
  if(k==='dash'){ await renderDash(); return; }
  if(k==='reviews'){ await renderReviews(); return; }
  if(k==='projects'){ await renderProjects(); return; }
  if(k==='flow'){ await renderFlow(); return; }
  if(k==='logs'){ await renderLogs(); return; }
  if(k==='settings'){ await renderSettings(); return; }
  if(k.startsWith('db-')){ await renderBoard(k); return; }
  const d = DEF[k];
  if(!d){ v.innerHTML = '<div class="empty">未实现</div>'; return; }
  await renderTable(d, keepQ);
}

async function renderTable(d, keepQ){
  const v = document.getElementById('view');
  const rows = await api('/api/'+d.tbl + (S.q?('?q='+encodeURIComponent(S.q)):''));
  S.data[d.tbl] = rows;
  if(!keepQ) v.scrollTop = 0;

  let head = '<div class="toolbar">';
  head += '<button class="btn pri" onclick="openForm(\''+d.tbl+'\')">＋ 新增'+esc(d.title)+'</button>';
  head += '<span class="hint">共 '+rows.length+' 条</span>';
  if (d.tbl === 'leads') {
    const _t0 = rows.filter(r => r.next_follow && daysFrom(r.next_follow) <= 0 &&
      ['客户接受','已关闭','无效关闭','已过期','客户拒绝'].indexOf(r.status) < 0).length;
    if (_t0) head += '<span class="tag t-red">今日待跟进 '+_t0+'</span>';
  }
  head += '<span class="sp"></span>';
  head += '</div>';

  let body = '';
  if(!rows.length){
    body = '<div class="tw"><div class="empty">还没有'+esc(d.title)+'记录<br><span style="font-size:11.5px">点左上「＋ 新增」开始，或去系统设置载入演示数据</span></div></div>';
  } else {
    body = '<div class="tw"><table><thead><tr>' + d.cols.map(c=>'<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.t)+'</th>').join('') + '</tr></thead><tbody>';
    body += rows.map(r=>{
      return '<tr onclick="openDrawer(\''+d.tbl+'\','+r.id+')">' + d.cols.map(c=>{
        let val;
        if(c.fmt) val = c.fmt(r);
        else val = esc(r[c.k]!==undefined && r[c.k]!==null && r[c.k]!=='' ? r[c.k] : '—');
        return '<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+val+'</td>';
      }).join('') + '</tr>';
    }).join('');
    body += '</tbody></table></div>';
  }
  v.innerHTML = head + body;
}

/* ============ 表单 ============ */
function optsOf(f){
  if(Array.isArray(f.opts)) return f.opts;
  if(typeof f.opts === 'string' && S.meta && S.meta[f.opts]) return S.meta[f.opts];
  return [];
}
function fieldHtml(f, val){
  const id = 'F_'+f.k;
  const rq = f.req ? ' <span class="rq">*</span>' : '';
  let ctl = '';
  if(f.type==='textarea'){
    ctl = '<textarea id="'+id+'" '+(f.req?'required':'')+'>'+esc(val)+'</textarea>';
  } else if(f.ref){
    const list = S.data[f.ref] || [];
    const key = f.ref==='customers' ? 'name_en' : (f.ref==='projects' ? 'proj_no' : 'lead_no');
    ctl = '<select id="'+id+'"><option value="">— 请选择 —</option>' + list.map(o=>{
      const label = (o[key]||('#'+o.id)) + (f.ref==='projects' && o.title ? ' · '+o.title : '');
      return '<option value="'+o.id+'"'+(String(val)===String(o.id)?' selected':'')+'>'+esc(label)+'</option>';
    }).join('') + '</select>';
  } else if(f.opts){
    const os = optsOf(f);
    ctl = '<select id="'+id+'"><option value="">— 请选择 —</option>' + os.map(o=>'<option'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>').join('') + '</select>';
  } else if(f.ro){
    ctl = '<input id="'+id+'" value="'+esc(val)+'" readonly style="background:#F3F7F9;color:var(--gray)">';
  } else {
    const t = f.type || 'text';
    ctl = '<input id="'+id+'" type="'+t+'" value="'+esc(val)+'"'+(f.req?' required':'')+'>';
  }
  return '<div class="fi"><label for="'+id+'">'+esc(f.t)+rq+'</label>'+ctl+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'')+'</div>';
}
function layoutFields(fields, vals){
  let buf = [], out = '';
  fields.forEach(f=>{
    const h = fieldHtml(f, vals[f.k]!==undefined&&vals[f.k]!==null ? vals[f.k] : (f.k==='status'?defStatus(f):''));
    if(f.full){
      if(buf.length){ out += '<div class="fg">'+buf.join('')+'</div>'; buf=[]; }
      out += '<div class="fg one">'+h+'</div>';
    } else {
      buf.push(h);
      if(buf.length===2){ out += '<div class="fg">'+buf.join('')+'</div>'; buf=[]; }
    }
  });
  if(buf.length) out += '<div class="fg">'+buf.join('')+'<div></div></div>';
  return out;
}
function defStatus(f){
  const map = {quotes:'待发出', contracts:'待签', production:'待排产', purchases:'待下单',
               outbounds:'待出库', shipments:'待发运', payments:'待确认', leads:'初次联系'};
  return map[f.tbl] || '';
}
function openForm(tbl, preset){
  const d = DEF[tbl];
  const vals = Object.assign({}, preset||{});
  // 默认值
  d.fields.forEach(f=>{
    if(vals[f.k]!==undefined) return;
    if(f.type==='date' && ['qdate','sign_date','odate','pdate','plan_start','first_contact','last_follow'].includes(f.k)) vals[f.k]=todayStr();
    if(f.k==='status') vals[f.k] = defStatus({tbl});
    if(f.k==='currency') vals[f.k]='USD';
    if(f.k==='owner') vals[f.k]=S.user;
    if(f.k==='valid_days') vals[f.k]=30;
    if(f.k==='incoterm') vals[f.k]='FOB';
    if(f.k==='transport') vals[f.k]='铁路';
    if(f.k==='method') vals[f.k]='T/T 电汇';
  });
  const html = '<div class="mh"><b>新增'+esc(d.title)+'</b><span class="x" onclick="closeModal()">×</span></div>'+
    '<div class="mb">'+layoutFields(d.fields, vals)+'</div>'+
    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn pri" onclick="saveForm(\''+tbl+'\',null)">保存</button></div>';
  showModal(html);
  setTimeout(()=>{ const el=document.querySelector('#mb input,#mb select,#mb textarea'); if(el) el.focus(); }, 60);
}
async function saveForm(tbl, id){
  const d = DEF[tbl];
  const body = {};
  let miss = null;
  for(const f of d.fields){
    const el = document.getElementById('F_'+f.k);
    if(!el) continue;
    let v = el.value;
    if(f.req && !v){ miss = f.t; break; }
    body[f.k] = v;
  }
  if(miss){ toast('请填写：'+miss, true); return; }
  try{
    if(id) await api('/api/'+tbl+'/'+id, {method:'PUT', body});
    else await api('/api/'+tbl, {method:'POST', body});
    closeModal(); toast('已保存');
    S.data[tbl] = null;
    ['customers','leads','projects'].forEach(t=>S.data[t]=null);
    if(S.drawer && S.drawer.tbl===tbl && id) openDrawer(tbl, id, S.drawer.tab);
    else renderView(S.view);
  }catch(e){ toast(e.message, true); }
}
function showModal(html, opt){
  opt = opt||{};
  const box = document.getElementById('mbox');
  if(opt.width) box.style.width = opt.width+'px'; else box.style.width='720px';
  box.innerHTML = html;
  document.getElementById('modal').classList.add('on');
}
function openModal(title, bodyHtml, footer, opt){
  opt = opt||{};
  const h = '<div class="mh"><b>'+esc(title)+'</b><span class="x" onclick="closeModal()">×</span></div>'+
    '<div class="mb">'+bodyHtml+'</div>'+
    (opt.hideFooter?'':'<div class="mf">'+(footer||'<button class="btn" onclick="closeModal()">关闭</button>')+'</div>');
  showModal(h, opt);
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target.id==='modal') closeModal();
});

/* ============ 抽屉 ============ */
const CHILD_LABEL = {leads:'线索',opportunities:'机会点',projects:'项目',quotes:'报价单',contracts:'合同',
  production:'生产订单',purchases:'采购单',outbounds:'出库单',shipments:'发货单',payments:'回款单',
  reviews:'评审记录',contacts:'联系人'};
const CHILD_TBL = {leads:'leads',opportunities:'opps',projects:'projects',quotes:'quotes',contracts:'contracts',
  production:'production',purchases:'purchases',outbounds:'outbounds',shipments:'shipments',payments:'payments'};

async function openDrawer(tbl, id, tab){
  fileish = 0;
  const d = await api('/api/'+tbl+'/'+id);
  S.drawer = {tbl, id, d, tab: tab || 'info'};
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
  renderDrawer();
}
let fileish = 0;
function closeDrawer(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  S.drawer = null;
}
function drawerTitle(){
  const d = S.drawer.d, t = S.drawer.tbl;
  if(t==='customers') return [d.name_en, d.code + (d.country?(' · '+d.country+' · '+(d.city||'')):'')];
  if(t==='leads') return [d.company, d.lead_no + ' · ' + (d.country||'') + (d.city?(' · '+d.city):'')];
  if(t==='opportunities') return [d.title, d.opp_no + ' · ' + money(d.amount,d.currency)];
  if(t==='projects') return [d.title, d.proj_no + ' · ' + (d.country||'') + ' · 阶段：' + (d.stage||'')];
  const noKey = {quotes:'quote_no',contracts:'contract_no',production:'prod_no',purchases:'po_no',
                 outbounds:'out_no',shipments:'ship_no',payments:'pay_no'}[t];
  const nmKey = {contracts:'name',production:'product',purchases:'material',outbounds:'detail',
                 shipments:'dest',quotes:'quote_no',payments:'pay_no'}[t];
  return [d[nmKey] || d[noKey] || ('#'+d.id), (d[noKey]||'') + (d.amount?(' · '+money(d.amount,d.currency)):'')];
}
function renderDrawer(){
  const {tbl, d, tab} = S.drawer;
  const [t1, t2] = drawerTitle();
  const kids = Object.keys(d._children||{});
  let tabsHtml = '<div class="tab '+(tab==='info'?'on':'')+'" onclick="setTab(\'info\')">资料</div>';
  kids.forEach(k=>{
    const n = d._children[k].length;
    tabsHtml += '<div class="tab '+(tab===k?'on':'')+'" onclick="setTab(\''+k+'\')">'+esc(CHILD_LABEL[k]||k)+' <span class="c">'+n+'</span></div>';
  });
  let bodyHtml = '';
  if(tab==='info') bodyHtml = infoPanel(tbl, d);
  else bodyHtml = childPanel(tbl, k2=tbl, k=tab, items=d._children[tab]);

  document.getElementById('drawer').innerHTML =
    '<div class="dh"><div><div class="t1">'+esc(t1||'')+'</div><div class="t2">'+esc(t2||'')+'</div></div>'+
    '<span class="x" onclick="closeDrawer()">×</span></div>'+
    '<div class="tabs">'+tabsHtml+'</div>'+
    '<div class="db" id="dbody">'+bodyHtml+'</div>';
}
function setTab(t){ S.drawer.tab = t; renderDrawer(); }

function infoPanel(tbl, d){
  const def = DEF[tbl];
  let rowsHtml = '';
  if(tbl==='projects'){
    rowsHtml += kv('项目编号', d.proj_no) + kv('当前阶段', '<span class="tag '+stageCls(d.stage)+'">'+esc(d.stage)+'</span>');
    rowsHtml += kv('合同额(USD)', '<b>'+usdTxt(d.amount_usd)+'</b>') + kv('已回款(USD)', '<b style="color:var(--green)">'+usdTxt(d.paid_usd)+'</b>');
    rowsHtml += kv('应收余额(USD)', '<b style="color:'+(d.due_usd>0?'var(--red)':'var(--green)')+'">'+usdTxt(d.due_usd)+'</b>') + kv('回款率', '<b>'+d.rate+'%</b>');
    rowsHtml += '<div class="full" style="height:1px;background:var(--line2);margin:4px 0"></div>';
  }
  def.fields.forEach(f=>{
    if(f.ro) return;
    let v = d[f.k];
    if(f.ref && v) v = refText(f.ref, v);
    if(f.type==='date' && !v) v='—';
    if(v===undefined||v===null||v==='') v='—';
    rowsHtml += kv(f.t, esc(v));
  });
  // 项目财务提示
  let notice = '';
  if(tbl==='projects'){
    if(d.stage==='完成') notice = '<div class="notice ok"><b>已结清</b> · 合同额全部回款，项目自动归档为完成。</div>';
    else if(d.due_usd>0) notice = '<div class="notice">应收余额 <b>'+usdTxt(d.due_usd)+'</b>　·　阶段由系统根据单据自动判定，不用手填。</div>';
  }
  if(tbl==='leads' && d.next_follow){
    const dd = daysFrom(d.next_follow);
    if(dd<0) notice = '<div class="notice warn"><b>已逾期 '+(-dd)+' 天</b> · 请尽快跟进，或改约下次提醒时间。</div>';
    else if(dd<=3) notice = '<div class="notice warn"><b>'+(dd===0?'今天':dd+' 天后')+'要跟进</b> · '+esc(d.next_follow)+'</div>';
  }
  return notice + '<div class="dl">'+rowsHtml+'</div>'+
    '<div style="margin-top:18px;display:flex;gap:8px"><button class="btn" onclick="editCurrent()">✎ 编辑</button>'+
    '<button class="btn dg" onclick="delCurrent()">删除</button></div>';
}
function kv(k, v){
  return '<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>';
}
function editCurrent(){
  const {tbl, id} = S.drawer;
  const def = DEF[tbl];
  const vals = Object.assign({}, S.drawer.d);
  const html = '<div class="mh"><b>编辑'+esc(def.title)+'</b><span class="x" onclick="closeModal()">×</span></div>'+
    '<div class="mb">'+layoutFields(def.fields, vals)+'</div>'+
    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn pri" onclick="saveForm(\''+tbl+'\','+id+')">保存</button></div>';
  showModal(html);
}
async function delCurrent(){
  const {tbl, id, d} = S.drawer;
  if(!confirm('确定删除这条记录？子记录也会一并删除，不可恢复。')) return;
  try{
    await api('/api/'+tbl+'/'+id, {method:'DELETE'});
    closeDrawer(); toast('已删除');
    S.data[tbl]=null; ['customers','leads','projects'].forEach(t=>S.data[t]=null);
    renderView(S.view);
  }catch(e){ toast(e.message,true); }
}

function childPanel(parentTbl, _x, k, items){
  const ctbl = CHILD_TBL[k] || k;
  const def = DEF[ctbl];
  let h = '<div style="display:flex;align-items:center;margin-bottom:11px"><span class="hint">共 '+items.length+' 条</span><span style="flex:1"></span>'+
    '<button class="btn sm pri" onclick="addSub(\''+ctbl+'\',\''+k+'\')">＋ 新增</button></div>';
  if(!items.length) return h + '<div class="empty">暂无'+esc(CHILD_LABEL[k])+'</div>';
  if(!def){
    // reviews 特殊
    h += '<div class="tw"><table><thead><tr><th>步骤</th><th>评审人</th><th>结果</th><th>意见</th><th>日期</th></tr></thead><tbody>';
    h += items.map(r=>'<tr><td class="strong">'+esc(r.step)+'</td><td>'+esc(r.reviewer)+'</td><td><span class="tag t-a">'+esc(r.result)+'</span></td><td>'+esc(r.comment)+'</td><td class="mono">'+esc(r.rdate)+'</td></tr>').join('');
    return h + '</tbody></table></div>';
  }
  h += '<div class="tw"><table><thead><tr>' + def.cols.slice(0,5).map(c=>'<th>'+esc(c.t)+'</th>').join('') + '<th style="width:64px"></th></tr></thead><tbody>';
  h += items.map(r=>{
    return '<tr onclick="openDrawer(\''+ctbl+'\','+r.id+')">' + def.cols.slice(0,5).map(c=>{
      let val = c.fmt ? c.fmt(r) : esc(r[c.k]!=null&&r[c.k]!==''?r[c.k]:'—');
      return '<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+val+'</td>';
    }).join('') + '<td><button class="btn sm gh" onclick="event.stopPropagation();delSub(\''+ctbl+'\','+r.id+')">删</button></td></tr>';
  }).join('');
  return h + '</tbody></table></div>';
}
function addSub(ctbl, k){
  const def = DEF[ctbl];
  const vals = {};
  if(S.drawer.tbl==='customers'){
    if(ctbl==='leads'||ctbl==='opportunities'||ctbl==='projects'||ctbl==='quotes'||ctbl==='contracts'||ctbl==='payments'){
      // 客户下新增，自动填客户
    }
  }
  const preset = {};
  if(S.drawer.tbl==='projects') preset['proj_id'] = S.drawer.id;
  if(S.drawer.tbl==='leads') preset['lead_id'] = S.drawer.id;
  if(S.drawer.tbl==='opportunities') preset['opp_id'] = S.drawer.id;
  if(['customers'].includes(S.drawer.tbl)) preset['customer_id'] = S.drawer.id;
  openForm(ctbl, preset);
}
async function delSub(ctbl, id){
  if(!confirm('确定删除这条'+esc(CHILD_LABEL[ctbl]||'')+'？')) return;
  try{
    await api('/api/'+ctbl+'/'+id, {method:'DELETE'});
    toast('已删除');
    const cur = S.drawer;
    await openDrawer(cur.tbl, cur.id, cur.tab);
    S.data[ctbl]=null;
  }catch(e){ toast(e.message,true); }
}
</script>

<script>
/* ============ 工作台 ============ */
function usdShort(x){
  x = Number(x) || 0;
  if(Math.abs(x) >= 1e6) return '$' + (x / 1e6).toFixed(2) + 'M';
  if(Math.abs(x) >= 1e3) return '$' + Math.round(x / 1e3) + 'K';
  return '$' + Math.round(x);
}

async function renderDash(){
  const v = document.getElementById('view');
  let d = null;
  try{
    d = await api('/api/dash');
  }catch(e){
    v.innerHTML = '<div class="notice warn">工作台加载失败：'+esc(e.message)+'</div>';
    return;
  }
  S.data.dash = d;
  renderNav();

  let h = '';
  h += '<div style="display:flex;align-items:baseline;gap:16px;margin:2px 0 18px;flex-wrap:wrap">'
     + '<div style="font-size:19px;font-weight:700;color:#12303F;letter-spacing:.2px">'+esc(d.greet)+'</div>'
     + '<div style="font-size:12px;color:#7B8C97">'+esc(d.role)+' · '+esc(d.dept)+' · '+esc(d.today)+'</div>'
     + '</div>';

  h += '<div class="kpis">';
  (d.kpis||[]).forEach(function(k){
    let val = k.vl;
    if(typeof val === 'number'){
      val = (Math.abs(val) >= 10000) ? usdTxt(val) : String(val);
    }else{
      val = esc(String(val==null?'':val));
    }
    h += '<div class="kpi '+esc(k.cls||'')+'">'
       + '<div class="lb">'+esc(k.lb)+'</div>'
       + '<div class="vl">'+val+'</div>'
       + (k.sub ? '<div class="sub">'+esc(k.sub)+'</div>' : '')
       + '</div>';
  });
  h += '</div>';

  if(d.overview && d.overview.items && d.overview.items.length){
    const ov = d.overview;
    h += '<div class="sec"><div class="sec-h"><h2>数据总览</h2><div class="line"></div>'
       + '<span class="more" onclick="go(\'flow\')">全流程看板 ›</span></div>'
       + '<div class="card" style="padding:14px 16px 15px">'
       + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:7px">';
    ov.items.forEach(function(o){
      let val;
      if(o.t === 'amt'){ val = usdShort(o.v); }
      else { val = String(o.v); }
      const fs = (o.t === 'amt' && val.length > 6) ? 15 : 18;
      h += '<div style="position:relative;padding:9px 9px 10px 11px;'
         + 'background:linear-gradient(180deg,#FCFEFF 0%,#F3F9FB 100%);'
         + 'border-radius:7px;border-left:3px solid ' + esc(o.c||'#0A7CB3') + ';'
         + 'box-shadow:0 1px 2px rgba(16,58,80,.045)">'
         + '<div style="font-size:9px;font-weight:700;color:' + esc(o.c||'#0A7CB3') + ';opacity:.75;letter-spacing:.6px;margin-bottom:5px">' + esc(o.no) + '</div>'
         + '<div style="font-size:11px;color:#5E7480;margin-bottom:4px">' + esc(o.lb) + '</div>'
         + '<div style="font-size:' + fs + 'px;font-weight:700;color:#12303F;line-height:1.05;font-variant-numeric:tabular-nums">' + esc(val) + '</div>'
         + '<div style="font-size:9.5px;color:#9DAFBA;margin-top:5px">' + esc(o.sub||'') + '</div>'
         + '</div>';
    });
    h += '</div>';

       + '</div>';

  (d.panels||[]).forEach(function(p){
    h += '<div class="sec"><div class="sec-h"><h2>'+esc(p.title)+'</h2><div class="line"></div>'
       + (p.more ? '<span class="more" onclick="go(\''+esc(p.more)+'\')">查看全部 ›</span>' : '')
       + '</div><div class="card">';

      h += '<div class="empty">'+esc(p.empty||'暂无数据')+'</div>';
    }else{
      h += '<table><thead><tr>' + (p.cols||[]).map(function(c){ return '<th>'+esc(c)+'</th>'; }).join('') + '</tr></thead><tbody>';
      p.rows.forEach(function(r){
        h += '<tr>';
        (r||[]).forEach(function(cell, i){
          const isNum = (typeof cell === 'number');
          const txt = isNum ? usdTxt(cell) : esc(cell==null?'—':String(cell));

        });

      });
      h += '</tbody></table>';
    }
    h += '</div></div>';
  });

  v.innerHTML = h;
}

/* ============ 评审中心 ============ */
async function renderReviews(){
  const v = document.getElementById('view');
  const opps = await api('/api/opportunities');
  S.data.opportunities = opps;
  const revs = await api('/api/reviews');
  S.data.reviews = revs;

  const groups = {};
  opps.forEach(o=>{
    const rs = revs.filter(r=>String(r.opp_id)===String(o.id));
    o._done = rs.length; o._revs = rs;
    const step = o._done>=4 ? '已完成' : S.meta.review_steps[o._done];
    (groups[step] = groups[step]||[]).push(o);
  });

  let h = '<div class="notice"><b>评审四步</b>　业务初评 → 技术评审 → 负责人复核 → 总经理终审。全部通过后，机会点才可以立项成为项目。</div>';
  const order = ['业务初评','技术评审','负责人复核','总经理终审','已完成'];
  const label = {业务初评:'待业务初评',技术评审:'待技术评审',负责人复核:'待负责人复核',总经理终审:'待总经理终审',已完成:'已通过（可立项）'};
  order.forEach(st=>{
    const list = groups[st]||[];
    if(!list.length) return;
    h += '<div class="sec"><div class="sec-h"><h2>'+esc(label[st])+'</h2><span class="tag '+(st==='已完成'?'t-a':'t-b')+'">'+list.length+'</span><div class="line"></div></div>';
    h += '<div class="card" style="padding:0">';
    list.forEach(o=>{
      const dots = [0,1,2,3].map(i=>'<span style="display:inline-block;width:20px;height:5px;border-radius:3px;background:'+(i<o._done?'var(--green)':'#E4EDF1')+';margin-right:4px"></span>').join('');
      h += '<div style="padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:14px">'+
        '<div style="flex:1"><div style="font-weight:650;font-size:13px">'+esc(o.title)+'</div>'+
        '<div class="hint" style="margin-top:4px">'+esc(o.opp_no)+' · '+esc(o.country||'')+(o.city?' · '+esc(o.city):'')+' · '+esc(o.ptype||'')+' · 负责人 '+esc(o.owner||'—')+'</div></div>'+
        '<div style="text-align:right"><div style="font-weight:680;font-size:14px;color:var(--blue-d);font-variant-numeric:tabular-nums">'+money(o.amount,o.currency)+'</div><div style="margin-top:5px">'+dots+'</div></div>'+
        '<button class="btn sm '+(o._done>=4?'gr':'pri')+'" onclick="openDrawer(\'opportunities\','+o.id+',\'reviews\')">'+(o._done>=4?'查看':'进入评审')+'</button>'+
      '</div>';
    });
    h += '</div></div>';
  });
  v.innerHTML = h || '<div class="empty">暂无机会点</div>';
}

      '<div class="kpi"><div class="lb">待排产</div><div class="vl">'+cnt('待排产')+'</div><div class="sub">待安排</div></div>'+
      '<div class="kpi a"><div class="lb">生产中</div><div class="vl">'+cnt('生产中')+'</div><div class="sub">在制</div></div>'+
      '<div class="kpi g"><div class="lb">已完工 / 入库</div><div class="vl">'+(cnt('已完工')+cnt('已入库'))+'</div><div class="sub">可发运</div></div>'+
      '</div>';
    h += '<div class="tw"><table><thead><tr><th>生产单号</th><th>关联项目</th><th>产品</th><th>规格</th><th>数量</th><th style="width:150px">进度</th><th>状态</th></tr></thead><tbody>';
    if(!prods.length) h += '<tr><td colspan="7"><div class="empty">暂无生产订单</div></td></tr>';
    prods.forEach(p=>{
      h += '<tr onclick="openDrawer(\'production\','+p.id+')"><td class="mono">'+esc(p.prod_no)+'</td><td class="mono">'+esc(p.proj_no||'')+'</td><td class="strong">'+esc(p.product)+'</td><td class="hint">'+esc(p.spec||'')+'</td><td class="num">'+esc(p.qty||0)+' '+esc(p.unit||'')+'</td><td><div style="height:6px;background:#EEF3F6;border-radius:3px;overflow:hidden"><div style="height:100%;width:'+(p.progress||0)+'%;background:var(--blue)"></div></div><div class="hint">'+esc(p.progress||0)+'%</div></td><td><span class="tag '+statusCls(p.status)+'">'+esc(p.status||'')+'</span></td></tr>';
    });
    h += '</tbody></table></div>';
  }

  else if(k==='db-mat'){
    const outs = await api('/api/outbounds');
    const pos = await api('/api/purchases');
    const ships = await api('/api/shipments');
    S.data.outbounds = outs; S.data.purchases = pos; S.data.shipments = ships;
    h += '<div class="kpis">'+
      '<div class="kpi b"><div class="lb">采购在途</div><div class="vl">'+pos.filter(x=>x.status==='在途'||x.status==='已下单').length+'</div><div class="sub">共 '+pos.length+' 张采购单</div></div>'+
      '<div class="kpi a"><div class="lb">待发货</div><div class="vl">'+outs.filter(x=>x.status!=='已出库').length+'</div><div class="sub">已装箱待运</div></div>'+
      '<div class="kpi g"><div class="lb">在途 / 已报关</div><div class="vl">'+ships.filter(x=>['已报关','在途','已到港'].includes(x.status)).length+'</div><div class="sub">共 '+ships.length+' 批发运</div></div>'+
      '</div>';
    h += '<div class="sec"><div class="sec-h"><h2>出库明细</h2><div class="line"></div><span class="more" onclick="go(\'outbounds\')">出库单 ›</span></div>';
    h += '<div class="tw"><table><thead><tr><th>出库单号</th><th>关联项目</th><th>明细</th><th>箱数</th><th>出库日期</th><th>状态</th></tr></thead><tbody>';
    if(!outs.length) h += '<tr><td colspan="6"><div class="empty">暂无出库记录</div></td></tr>';
        outs.forEach(o=>{
      h += '<tr onclick="openDrawer(\'outbounds\','+o.id+')"><td class="mono">'+esc(o.out_no)+'</td><td class="mono">'+esc(o.proj_no||'')+'</td><td class="strong">'+esc(o.detail)+'</td><td class="num">'+esc(o.boxes||0)+'</td><td class="mono">'+esc(o.odate||'')+'</td><td><span class="tag '+statusCls(o.status)+'">'+esc(o.status||'')+'</span></td></tr>';
    });
    h += '</tbody></table></div></div>';
    h += '<div class="sec"><div class="sec-h"><h2>发运跟踪</h2><div class="line"></div><span class="more" onclick="go(\'shipments\')">发货单 ›</span></div>';
    h += '<div class="tw"><table><thead><tr><th>发货单号</th><th>目的地</th><th>运输</th><th>提单号</th><th>ETD</th><th>ETA</th><th>状态</th></tr></thead><tbody>';
    if(!ships.length) h += '<tr><td colspan="7"><div class="empty">暂无发运记录</div></td></tr>';
    ships.forEach(x=>{
      h += '<tr onclick="openDrawer(\'shipments\','+x.id+')"><td class="mono">'+esc(x.ship_no)+'</td><td class="strong">'+esc(x.dest)+'</td><td>'+esc(x.transport||'')+'</td><td class="mono">'+esc(x.bl_no||'')+'</td><td class="mono">'+esc(x.etd||'')+'</td><td class="mono">'+esc(x.eta||'')+'</td><td><span class="tag '+statusCls(x.status)+'">'+esc(x.status||'')+'</span></td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  v.innerHTML = h;
}

/* ============ 日志 ============ */
async function renderLogs(){
  const v = document.getElementById('view');
  const logs = await api('/api/logs');
  let h = '<div class="notice">所有操作留痕：操作人、时间、动作、对象 · 共 '+logs.length+' 条</div>';
  h += '<div class="tw"><table><thead><tr><th style="width:140px">时间</th><th style="width:90px">操作人</th><th style="width:70px">动作</th><th style="width:180px">对象</th><th>内容</th></tr></thead><tbody>';
  if(!logs.length) h += '<tr><td colspan="5"><div class="empty">暂无操作记录</div></td></tr>';
  logs.forEach(l=>{
    h += '<tr style="cursor:default"><td class="mono">'+esc(l.ts)+'</td><td>'+esc(l.user)+'</td><td><span class="tag t-gray">'+esc(l.action)+'</span></td><td class="mono">'+esc(l.target||'')+'</td><td>'+esc(l.detail||'')+'</td></tr>';
  });
  h += '</tbody></table></div>';
  v.innerHTML = h;
}

/* ============ 系统设置 ============ */
async function renderSettings(){
  const v = document.getElementById('view');
  const s = await api('/api/summary');
  S.data.summary = s;
  let h = '';
  h += '<div class="sec"><div class="sec-h"><h2>数据管理</h2><div class="line"></div></div><div class="card" style="padding:16px 18px">';
  h += '<div class="hint" style="margin-bottom:12px">所有数据保存在本机 <b>ltc.db</b>（SQLite），刷新不丢、关网页不丢、不上传任何服务器。备份 = 复制这个文件。</div>';
  h += '<div style="display:flex;gap:9px;flex-wrap:wrap">';
  h += '<button class="btn pri" onclick="doSeed()">载入演示数据</button>';
  h += '<button class="btn" onclick="doClear()">清空全部数据</button>';
  h += '</div>';
  h += '<div style="margin-top:14px;display:flex;gap:26px;font-size:12.5px;color:var(--ink2)">'+
       '<div>当前：客户 <b>'+((S.data.customers||[]).length)+'</b> · 线索 <b>'+s.leads_total+'</b> · 机会点 <b>'+s.opps_total+'</b> · 项目 <b>'+s.projects_total+'</b></div>'+
       '</div>';
  h += '</div></div>';

  h += '<div class="sec"><div class="sec-h"><h2>角色与权限（10 个角色）</h2><div class="line"></div></div><div class="tw"><table><thead><tr><th>姓名</th><th>部门</th><th>岗位</th><th>可见模块</th></tr></thead><tbody>';
  S.meta.roles.forEach(r=>{
    const p = r.perms.includes('*') ? '全部' : r.perms.join(' / ');
    h += '<tr style="cursor:default"><td class="strong">'+esc(r.uname)+'</td><td>'+esc(r.dept)+'</td><td>'+esc(r.role)+'</td><td class="hint">'+esc(p)+'</td></tr>';
  });
  h += '</tbody></table></div></div>';

  h += '<div class="sec"><div class="sec-h"><h2>这套系统的口径</h2><div class="line"></div></div><div class="card" style="padding:16px 18px;line-height:1.9;font-size:12.5px;color:var(--ink2)">';
  h += '<b style="color:var(--ink)">1. 阶段由单据自动推进</b><br>有报价单→「报价」；有合同→「合同」；有生产→「生产」；有采购→「采购」；有出库→「仓储」；有报关/发运→「发货」；有回款→「回款」；全额回款→「完成」。<b>没有人可以手填阶段，所以不会出现「已发货还写着报价」。</b><br><br>';
  h += '<b style="color:var(--ink)">2. 金额只有一个算法</b><br>应收余额 = 合同总额 − 已回款。全系统共用这一个公式，看板、项目卡、财务页取的都是同一个数。<br><br>';
  h += '<b style="color:var(--ink)">3. 三个数不混用</b><br>签约额（合同）/ 回款额（银行实收）/ 应收余额（未收）。只有回款 100% 的项目才算「已结清」= 真正成交。<br><br>';
  h += '<b style="color:var(--ink)">4. 多币种</b><br>合同和回款可以不同币种，系统按内置汇率折算 USD 汇总（USD 1 / CNY 0.14 / EUR 1.08 / UZS 0.00008 / KZT 0.0021），原始币种金额照实保留。';
  h += '</div></div>';
  v.innerHTML = h;
}
async function doSeed(){
  if(!confirm('载入演示数据会先清空现有数据，确定？')) return;
  try{
    await api('/api/seed', {method:'POST', body:{}});
    ['customers','leads','projects','opportunities'].forEach(t=>S.data[t]=null);
    toast('演示数据已载入'); go('dash');
  }catch(e){ toast(e.message,true); }
}
async function doClear(){
  if(!confirm('清空全部业务数据？不可恢复，建议先备份 ltc.db。')) return;
  try{
    await api('/api/clear', {method:'POST', body:{}});
    ['customers','leads','projects','opportunities'].forEach(t=>S.data[t]=null);
    toast('已清空'); go('dash');
  }catch(e){ toast(e.message,true); }
}

/* ============ 启动 ============ */
(async function boot(){
  try{
    try{ applyTheme(new URLSearchParams(location.search).get('t') || localStorage.getItem('ltc_theme') || 'a'); }catch(e){}
    S.meta = await api('/api/meta');
    setWho();
    const usp = new URLSearchParams(location.search);
    const v = usp.get('v');
    await go(v && TITLE[v] ? v : 'dash');
    if(usp.get('seed')==='1'){ await doSeed(); }
    if(usp.get('open')){ setTimeout(async ()=>{ const l = await api('/api/'+usp.get('open')); if(l.length) openDrawer(usp.get('open'), l[0].id); }, 500); }
  }catch(e){
    document.getElementById('view').innerHTML = '<div class="notice warn">无法连接后端：'+esc(e.message)+'<br>请确认 ltc_server.py 正在运行。</div>';
  }
})();
</script>
